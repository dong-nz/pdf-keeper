[package]
name = "pdfkeeper"
version = "0.0.1"
edition = "2024"

[dependencies]
lopdf = "0.46.0"
# DR-53: `image` is already in the tree via pdfium-render (jpeg-only features);
# declaring it with `png` enables the PNG encoding the cover cache writes.
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = "0.9.5"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
thiserror = "2.0.21"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
